; Desk Pet firmware. The engine in engine/ is a plain C++ library shared with
; the PC simulator; only platform/esp32 is board specific.
;
;   pio run -e esp32c3                 build
;   pio run -e esp32c3 -t upload       flash over USB-C
;   pio run -e esp32c3 -t uploadfs     copy fs/ (packs) into LittleFS
;   pio device monitor                 serial console (type "help")
;
; Flash recovery: hold BOOT, tap RESET, release BOOT, then upload.

[platformio]
default_envs = esp32c3
src_dir = platform/esp32
data_dir = fs

[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Os
  -DARDUINOJSON_USE_LONG_LONG=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  symlink://engine
  bblanchon/ArduinoJson@7.4.2
  lovyan03/LovyanGFX@1.1.16

; Phone notifications through the Chronos Android app (BLE). Wi-Fi + BLE +
; UI are tight in the C3's 400 KB RAM: keep Wi-Fi off except when polling.
[env:esp32c3-chronos]
extends = env:esp32c3
build_flags =
  ${env:esp32c3.build_flags}
  -DDP_WITH_CHRONOS=1
lib_deps =
  ${env:esp32c3.lib_deps}
  ; Unpinned: pin to the version CI resolves once it builds green.
  fbiego/ChronosESP32
